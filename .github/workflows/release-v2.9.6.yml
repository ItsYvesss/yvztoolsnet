name: Build and Release v2.9.8

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; python -m pip install -r requirements.txt

      - name: Build YVZNETMATH.exe
        shell: cmd
        run: |
          if exist build rmdir /s /q build
          if exist dist rmdir /s /q dist
          if exist YVZNETMATH.exe del /q YVZNETMATH.exe
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name YVZNETMATH --distpath . --icon "yvztools.ico" --add-data "yvznetmath_core.py;." --add-data "yvztools.ico;." --hidden-import websocket --hidden-import websocket._abnf --hidden-import websocket._core --hidden-import websocket._exceptions --hidden-import websocket._handshake --hidden-import websocket._http --hidden-import websocket._logging --hidden-import websocket._socket --hidden-import websocket._ssl_compat --hidden-import websocket._url --hidden-import websocket._utils --collect-submodules websocket yvz_gui.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "YVZNETMATH.exe")) {
            throw "YVZNETMATH.exe was not created."
          }
          $file = Get-Item -LiteralPath "YVZNETMATH.exe"
          Write-Host "Built $($file.Name) - $($file.Length) bytes"

      - name: Publish v2.9.8 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v2.9.8"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; replacing the EXE asset."
            gh release upload $tag YVZNETMATH.exe --clobber
          } else {
            Write-Host "Creating release $tag."
            gh release create $tag YVZNETMATH.exe --target main --title "YVZTOOLS v2.9.8" --generate-notes
          }

          gh release view $tag
