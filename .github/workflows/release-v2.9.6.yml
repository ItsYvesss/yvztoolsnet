name: Build and Release v2.9.6

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build YVZNETMATH.exe
        shell: cmd
        run: |
          if exist build rmdir /s /q build
          if exist YVZNETMATH.exe del /q YVZNETMATH.exe
          py -m PyInstaller --noconfirm --clean --onefile --windowed --name YVZNETMATH --distpath . --icon "yvztools.ico" --add-data "yvznetmath_core.py;." --add-data "yvztools.ico;." --hidden-import websocket --hidden-import websocket._abnf --hidden-import websocket._core --hidden-import websocket._exceptions --hidden-import websocket._handshake --hidden-import websocket._http --hidden-import websocket._logging --hidden-import websocket._socket --hidden-import websocket._ssl_compat --hidden-import websocket._url --hidden-import websocket._utils --collect-submodules websocket yvz_gui.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "YVZNETMATH.exe")) { throw "YVZNETMATH.exe was not created." }
          Get-Item "YVZNETMATH.exe" | Select-Object Name,Length

      - name: Create v2.9.6 GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v2.9.6 --yes 2>$null
          gh release create v2.9.6 YVZNETMATH.exe --title "YVZTOOLS v2.9.6" --generate-notes